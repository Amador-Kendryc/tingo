name: Compilar APKs Tingo ($0/Mes)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias y compilar APK Pasajero
        run: |
          if [ -d "mobile" ]; then cd mobile; fi
          flutter pub get
          flutter build apk --target=lib/passenger_app/main_passenger.dart --debug
          mkdir -p output_apks
          cp build/app/outputs/flutter-apk/app-debug.apk output_apks/Tingo_Pasajero.apk

      - name: Compilar APK Conductor
        run: |
          if [ -d "mobile" ]; then cd mobile; fi
          flutter build apk --target=lib/driver_app/main_driver.dart --debug
          mkdir -p output_apks
          cp build/app/outputs/flutter-apk/app-debug.apk output_apks/Tingo_Conductor.apk

      - name: Subir APKs creados como artefactos de descarga
        uses: actions/upload-artifact@v4
        with:
          name: Tingo_APKs_Android
          path: |
            **/output_apks/*.apk
